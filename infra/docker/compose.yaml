name: epet-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: epet
      POSTGRES_USER: epet
      POSTGRES_PASSWORD: epet_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - epet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epet -d epet"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - epet-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local-development
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - epet-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  epet-postgres:
  epet-redis:
  epet-minio:
