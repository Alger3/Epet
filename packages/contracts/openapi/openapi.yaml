openapi: 3.1.0
info:
  title: Epet API
  version: 0.1.0
  description: Draft MVP contract. PostgreSQL snapshots are authoritative; SSE only signals changes.
servers:
  - url: https://api.example.invalid
    description: Placeholder; real environment URLs are injected by deployment configuration.
tags:
  - name: Devices
  - name: Uploads
  - name: Generations
paths:
  /v1/devices/register:
    post:
      tags: [Devices]
      operationId: registerDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
      responses:
        '201':
          description: Device credential registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/devices/challenge:
    post:
      tags: [Devices]
      operationId: createDeviceChallenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceChallengeRequest'
      responses:
        '200':
          description: Single-use, short-lived signing challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceChallengeResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/devices/token:
    post:
      tags: [Devices]
      operationId: issueDeviceToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: Short-lived access token issued after challenge verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/uploads:
    post:
      tags: [Uploads]
      operationId: createUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: Restricted upload session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUploadResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/uploads/{upload_id}/complete:
    post:
      tags: [Uploads]
      operationId: completeUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Object verification accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSnapshot'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/uploads/{upload_id}/content:
    put:
      tags: [Uploads]
      operationId: putUploadContent
      description: Local-development upload proxy. Production may instead return a restricted object-store URL.
      security: []
      parameters:
        - $ref: '#/components/parameters/UploadId'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Bytes stored and integrity checked.
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/uploads/{upload_id}:
    delete:
      tags: [Uploads]
      operationId: deleteUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Deletion accepted.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/generations:
    post:
      tags: [Generations]
      operationId: createGeneration
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenerationRequest'
      responses:
        '201':
          description: Generation job created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSnapshot'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/capabilities:
    get:
      tags: [Generations]
      operationId: getGenerationCapabilities
      responses:
        '200':
          description: Best-effort local hardware, Provider and model snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationCapabilities'
  /v1/capabilities/probe:
    post:
      tags: [Generations]
      operationId: probeGenerationCapabilities
      responses:
        '202':
          description: Hardware and runtime probe queued.
  /v1/models/{model_id}/download:
    post:
      tags: [Generations]
      operationId: downloadGenerationModel
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '202':
          description: Model download command queued.
  /v1/models/{model_id}:
    delete:
      tags: [Generations]
      operationId: removeGenerationModel
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '202':
          description: Model removal command queued.
  /v1/generations/{job_id}:
    get:
      tags: [Generations]
      operationId: getGeneration
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Authoritative generation snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSnapshot'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Generations]
      operationId: deleteGeneration
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cloud deletion accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionSnapshot'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/deletions/{request_id}:
    get:
      tags: [Generations]
      operationId: getDeletion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeletionId'
      responses:
        '200':
          description: Current deletion request status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionSnapshot'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/generations/{job_id}/events:
    get:
      tags: [Generations]
      operationId: streamGenerationEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Best-effort change notifications. Re-query snapshot on connect, gaps or reconnect.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/generations/{job_id}/portrait/confirm:
    post:
      tags: [Generations]
      operationId: confirmPortrait
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Portrait confirmed idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSnapshot'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/generations/{job_id}/portrait/repackage:
    post:
      tags: [Generations]
      operationId: repackageConfirmedPortrait
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Approved portrait queued for artifact-only repackaging without rerunning diffusion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSnapshot'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/generations/{job_id}/portrait:
    get:
      tags: [Generations]
      operationId: getGenerationPortrait
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Generated static portrait preview and metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortraitPreview'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/generations/{job_id}/portrait/regenerate:
    post:
      tags: [Generations]
      operationId: regeneratePortrait
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      responses:
        '202':
          description: Portrait regeneration accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSnapshot'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/generations/{job_id}/actions/{action}/regenerate:
    post:
      tags: [Generations]
      operationId: regenerateAction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      responses:
        '202':
          description: Action regeneration accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSnapshot'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/generations/{job_id}/cancel:
    post:
      tags: [Generations]
      operationId: cancelGeneration
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      responses:
        '202':
          description: Cancellation accepted or already final.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSnapshot'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/generations/{job_id}/artifact:
    get:
      tags: [Generations]
      operationId: getGenerationArtifact
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Short-lived download grant; only available in ready state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^upl_[A-Za-z0-9_-]{8,64}$'
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^gen_[A-Za-z0-9_-]{8,64}$'
    DeletionId:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^del_[A-Za-z0-9_-]{8,64}$'
    Action:
      name: action
      in: path
      required: true
      schema:
        type: string
        enum: [idle, walk, sleep, tap, drag]
  responses:
    Problem:
      description: Stable machine-readable error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    DeviceRegisterRequest:
      type: object
      additionalProperties: false
      required: [public_key, client_version, registration_nonce]
      properties:
        public_key:
          type: string
          minLength: 32
          maxLength: 2048
        client_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'
        registration_nonce:
          type: string
          minLength: 32
          maxLength: 128
    DeviceChallengeRequest:
      type: object
      additionalProperties: false
      required: [credential_id]
      properties:
        credential_id:
          type: string
          pattern: '^dev_[A-Za-z0-9_-]{8,64}$'
    DeviceChallengeResponse:
      type: object
      additionalProperties: false
      required: [challenge, expires_at]
      properties:
        challenge:
          type: string
          minLength: 32
          maxLength: 512
        expires_at:
          type: string
          format: date-time
    DeviceTokenRequest:
      type: object
      additionalProperties: false
      required: [credential_id, challenge, signature]
      properties:
        credential_id:
          type: string
          pattern: '^dev_[A-Za-z0-9_-]{8,64}$'
        challenge:
          type: string
          minLength: 32
          maxLength: 512
        signature:
          type: string
          minLength: 32
          maxLength: 2048
    DeviceTokenResponse:
      type: object
      additionalProperties: false
      required: [credential_id, access_token, expires_at, refresh_credential]
      properties:
        credential_id:
          type: string
          pattern: '^dev_[A-Za-z0-9_-]{8,64}$'
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        refresh_credential:
          type: string
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [role, size, mime_type, sha256]
      properties:
        role:
          type: string
          enum: [primary, side, detail]
        size:
          type: integer
          minimum: 1
          maximum: 20971520
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    CreateUploadResponse:
      type: object
      additionalProperties: false
      required: [upload_id, upload_url, allowed_headers, expires_at, limits]
      properties:
        upload_id:
          type: string
          pattern: '^upl_[A-Za-z0-9_-]{8,64}$'
        upload_url:
          type: string
          format: uri
        allowed_headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
        limits:
          type: object
          additionalProperties: false
          required: [max_bytes]
          properties:
            max_bytes:
              type: integer
              minimum: 1
    UploadSnapshot:
      type: object
      additionalProperties: false
      required: [upload_id, status, version, updated_at]
      properties:
        upload_id:
          type: string
        status:
          type: string
          enum: [created, uploading, verifying, ready, failed, expired, deleted]
        version:
          type: integer
          minimum: 1
        updated_at:
          type: string
          format: date-time
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
    CreateGenerationRequest:
      type: object
      additionalProperties: false
      required: [primary_upload_id, additional_upload_ids, style_id, species, display_name]
      properties:
        primary_upload_id:
          type: string
          pattern: '^upl_[A-Za-z0-9_-]{8,64}$'
        additional_upload_ids:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            pattern: '^upl_[A-Za-z0-9_-]{8,64}$'
        style_id:
          type: string
          minLength: 1
          maxLength: 64
        species:
          type: string
          enum: [cat, human]
        subject_kind:
          type: string
          enum: [pet_cat, human_avatar]
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        provider_mode:
          type: string
          enum: [configured, auto, manual]
          default: configured
        requested_provider:
          type: string
          enum: [mock, cuda, openvino-gpu, openvino-cpu]
        requested_device_id:
          type: string
          maxLength: 128
    GenerationSnapshot:
      type: object
      additionalProperties: false
      required: [job_id, version, stage, retryable, created_at, updated_at]
      properties:
        job_id:
          type: string
          pattern: '^gen_[A-Za-z0-9_-]{8,64}$'
        version:
          type: integer
          minimum: 1
        stage:
          $ref: '#/components/schemas/GenerationStage'
        retryable:
          type: boolean
        progress:
          type: number
          minimum: 0
          maximum: 1
        provider:
          $ref: '#/components/schemas/GenerationProviderExecution'
        portrait:
          $ref: '#/components/schemas/PortraitState'
        portrait_preview_url:
          type: string
          format: uri
        confirmation_expires_at:
          type: string
          format: date-time
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GenerationProviderExecution:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [configured, auto, manual]
        requested:
          type: [string, 'null']
        device_requested:
          type: [string, 'null']
        actual:
          type: [string, 'null']
        device_actual:
          type: [string, 'null']
        model_id:
          type: [string, 'null']
        estimated_speed:
          type: [string, 'null']
    PortraitState:
      type: object
      additionalProperties: false
      required: [ready, confirmed, metrics]
      properties:
        ready:
          type: boolean
        confirmed:
          type: boolean
        metrics:
          type: object
          additionalProperties: true
    PortraitPreview:
      type: object
      additionalProperties: false
      required: [preview_url, size, sha256, metrics]
      properties:
        preview_url:
          type: string
          format: uri
        size:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        metrics:
          type: object
          additionalProperties: true
    GenerationCapabilities:
      type: object
      additionalProperties: true
      required: [schema_version, worker_online, providers, models]
      properties:
        schema_version:
          type: integer
          const: 1
        worker_online:
          type: boolean
        configured_provider:
          type: [string, 'null']
        hardware:
          oneOf:
            - $ref: '#/components/schemas/HardwareSnapshot'
            - type: 'null'
        runtime_probes:
          type: object
          additionalProperties: false
          properties:
            openvino:
              $ref: '#/components/schemas/RuntimeProbe'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderCapability'
        models:
          type: array
          items:
            type: object
            additionalProperties: true
    HardwareSnapshot:
      type: object
      additionalProperties: true
      required: [platform, computer_model, cpu, gpus, system_memory_mb, probed_at]
      properties:
        platform:
          type: string
        computer_model:
          type: string
        cpu:
          $ref: '#/components/schemas/HardwareDevice'
        gpus:
          type: array
          items:
            $ref: '#/components/schemas/HardwareDevice'
        system_memory_mb:
          oneOf:
            - type: integer
            - type: string
              const: unknown
        probed_at:
          type: string
          format: date-time
    HardwareDevice:
      type: object
      additionalProperties: false
      required: [id, kind, name, vendor, memory_mb, runtime, available]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [cpu, gpu]
        name:
          type: string
        vendor:
          type: string
        memory_mb:
          oneOf:
            - type: integer
            - type: string
              const: unknown
        runtime:
          type: string
        driver_version:
          type: string
        available:
          type: boolean
        unavailable_reason:
          type: [string, 'null']
    ProviderCapability:
      type: object
      additionalProperties: true
      required: [provider_id, display_name, available, model_downloaded, estimated_speed]
      properties:
        provider_id:
          type: string
          enum: [mock, cuda, openvino-gpu, openvino-cpu]
        display_name:
          type: string
        available:
          type: boolean
        model_downloaded:
          type: boolean
        estimated_speed:
          type: string
          enum: [fast, medium, slow, unknown]
        unavailable_reason:
          type: [string, 'null']
        detected:
          type: boolean
        runtime_available:
          type: boolean
        compile_verified:
          type: boolean
        inference_verified:
          type: boolean
        runtime_version:
          type: string
        full_device_name:
          type: string
        driver_version:
          type: string
        device_architecture:
          type: string
        supported_precisions:
          type: array
          items:
            type: string
        compile_time_ms:
          oneOf:
            - type: number
            - type: string
              const: unknown
        inference_time_ms:
          oneOf:
            - type: number
            - type: string
              const: unknown
    RuntimeProbe:
      type: object
      additionalProperties: false
      required:
        - runtime_id
        - detected
        - runtime_available
        - compile_verified
        - inference_verified
        - runtime_version
        - available_devices
        - target_device
        - full_device_name
      properties:
        runtime_id:
          type: string
        detected:
          type: boolean
        runtime_available:
          type: boolean
        compile_verified:
          type: boolean
        inference_verified:
          type: boolean
        runtime_version:
          type: string
        available_devices:
          type: array
          items:
            type: string
        target_device:
          type: string
        full_device_name:
          type: string
        driver_version:
          type: string
        device_architecture:
          type: string
        supported_precisions:
          type: array
          items:
            type: string
        compile_time_ms:
          oneOf:
            - type: number
            - type: string
              const: unknown
        inference_time_ms:
          oneOf:
            - type: number
            - type: string
              const: unknown
        error_code:
          type: [string, 'null']
        error_message:
          type: [string, 'null']
    GenerationStage:
      type: string
      enum: [created, validating, generating_portrait, awaiting_portrait_confirmation, portrait_confirmed, generating_actions, postprocessing, quality_check, packaging, ready, cancel_requested, failed, canceled, expired]
    VersionCommand:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          minimum: 1
    ArtifactResponse:
      type: object
      additionalProperties: false
      required: [download_url, size, sha256, expires_at]
      properties:
        download_url:
          type: string
          format: uri
        size:
          type: integer
          minimum: 1
          maximum: 31457280
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        expires_at:
          type: string
          format: date-time
    DeletionSnapshot:
      type: object
      additionalProperties: false
      required: [request_id, status, requested_at]
      properties:
        request_id:
          type: string
          pattern: '^del_[A-Za-z0-9_-]{8,64}$'
        status:
          type: string
          enum: [requested, processing, completed, failed]
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, params]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        params:
          type: object
          additionalProperties:
            type: [string, number, boolean]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, trace_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 128
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        params:
          type: object
          additionalProperties:
            type: [string, number, boolean]
        trace_id:
          type: string
          minLength: 8
          maxLength: 128
security:
  - bearerAuth: []
