name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify
        run: |
          npm test
          npm run test:e2e
          npm run lint

      - name: Build NSIS installer
        run: npm run build:desktop

      - name: Create checksums
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle/nsis"
          Get-ChildItem "$bundle/*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii "$bundle/SHA256SUMS.txt"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: epet-windows-x64-${{ github.ref_name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
